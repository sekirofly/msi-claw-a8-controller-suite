name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag and versions
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-alpha\.[0-9]+)?', tag)
          for name in ('package.json', 'plugin.json'):
              assert json.loads(Path(name).read_text())['version'] == tag[1:]
          PY
      # The install URL and the release tag must agree before anything is published.
      - run: python scripts/check_versions.py
      - run: python -m pip install PyYAML==6.0.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run build
      - run: node --test tests/frontend.cjs
      - run: python -m unittest discover -s tests -v
      - run: bash -n install-latest.sh && bash -n install.sh && bash -n diagnostics.sh
      - run: python scripts/package.py && python scripts/verify_package.py
      - name: Publish verified assets
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/msi-claw-a8-controller-suite.zip release/msi-claw-a8-controller-suite.zip.sha256 --clobber
          case "$RELEASE_TAG" in
            *-alpha.*) gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest ;;
          esac
